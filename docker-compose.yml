version: '3.8'

services:
  chat2api:
    build:
      context: https://github.com/你的用户名/chat2api-docker.git#main
    container_name: chat2api
    restart: unless-stopped
    networks:
      proxy-network:
        ipv4_address: 172.20.0.10
    ports:
      - "8080:8080"
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai

networks:
  proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
